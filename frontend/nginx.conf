server {
    listen 80;
    server_name localhost;

    # Le dossier où se trouvent les fichiers compilés de Vue.js
    root /usr/share/nginx/html;
    index index.html;

    # 1. ROUTAGE DE L'API VERS LE BACKEND (FIX CRITIQUE)
    location /api/ {
        # 'backend' est le nom du service dans le docker-compose
        # 8000 est le port interne du conteneur backend
        proxy_pass http://backend:8000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. ROUTAGE DE L'APPLICATION VUE.JS
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. MISE EN CACHE DES FICHIERS STATIQUES
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}