# docker-compose.yml
services:
  # ============================================================================
  # 🎨 1. FRONTEND : L'Interface UI (Vue.js -> Nginx Alpine)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cognitif_frontend
    ports:
      # Port hôte configurable (FRONTEND_PORT dans .env), 3333 par défaut
      - "${FRONTEND_PORT:-3333}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cognitif_net

  # ============================================================================
  # 🧠 2. BACKEND : L'Orchestrateur (FastAPI + Pydantic-AI)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cognitif_backend
    ports:
      # Port hôte configurable (BACKEND_PORT dans .env), 8020 par défaut
      - "${BACKEND_PORT:-8020}:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - cognitif_net

  # ============================================================================
  # 🔌 3. MCP SERVER : Le Connecteur Notion (FastMCP)
  # ============================================================================
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: cognitif_mcp
    ports:
      # Port hôte configurable (MCP_PORT dans .env), 8021 par défaut
      - "${MCP_PORT:-8021}:8000"
    # Secrets Notion isolés : seul ce conteneur les reçoit (le backend ne les voit jamais)
    env_file:
      - ./mcp-server/.env
    restart: unless-stopped
    networks:
      - cognitif_net

networks:
  cognitif_net:
    driver: bridge